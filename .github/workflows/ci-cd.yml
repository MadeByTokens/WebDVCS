name: CI/CD Pipeline

on:
  # Start a test-and-deploy run by hand from the Actions tab: a fork needs this for
  # its first deploy, because copying the repository is not a push.
  workflow_dispatch:
  push:
    branches: [ main, master, a_new_hope ]
    paths:
      - 'lib/**'
      - 'tests/**'
      - 'webdvcs*.js'
      - 'webdvcs-browser.html'
      - 'build-assets.js'
      - 'styles.css'
      - 'package*.json'
      - 'webpack.config.js'
      - 'playwright.config.js'
      - '.github/workflows/**'
  pull_request:
    branches: [ main, master, a_new_hope ]
    paths:
      - 'lib/**'
      - 'tests/**'
      - 'webdvcs*.js'
      - 'webdvcs-browser.html'
      - 'build-assets.js'
      - 'styles.css'
      - 'package*.json'
      - 'webpack.config.js'
      - 'playwright.config.js'
      - '.github/workflows/**'

jobs:
  test:
    name: 🧪 Test Suite
    # Not ubuntu-latest: the Playwright version in use cannot install its browser on a newer release.
    runs-on: ubuntu-24.04
    
    steps:
    - name: 📦 Checkout Code
      uses: actions/checkout@v6
      
    - name: 🟢 Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '20'
        cache: 'npm'
        
    - name: 📥 Install Dependencies
      run: npm ci
      
    - name: 🏗️ Build Application
      run: npm run build
      
    - name: 📦 Cache Playwright Browsers
      uses: actions/cache@v5
      id: playwright-cache
      with:
        path: ~/.cache/ms-playwright
        key: playwright-browsers-${{ hashFiles('package-lock.json') }}

    - name: 🎭 Install Playwright Browsers
      run: npx playwright install chromium --with-deps
      if: steps.playwright-cache.outputs.cache-hit != 'true'
      
    - name: 🧪 Run Node.js Tests
      run: npm test
      
    - name: 🌐 Run Browser Tests  
      run: npm run test:browser
      
    - name: 📊 Upload Test Results
      uses: actions/upload-artifact@v6
      if: always() && hashFiles('playwright-report/**') != ''
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30

  build:
    name: 🏗️ Build
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/a_new_hope'

    permissions:
      contents: read    # to checkout the repository
      pages: read       # to read the site's settings

    steps:
    - name: 📦 Checkout Code
      uses: actions/checkout@v6

    - name: 🟢 Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '20'
        cache: 'npm'

    - name: 📥 Install Dependencies
      run: npm ci

    - name: 🏗️ Build for Production
      run: npm run build:github

    - name: 📋 Setup Pages
      uses: actions/configure-pages@v6

    - name: 📤 Upload Pages Artifact
      uses: actions/upload-pages-artifact@v5
      with:
        path: ./dist

  # A job of its own: asked for in the same job as the upload, the site is not yet
  # listed and the deploy fails with "No artifacts named github-pages were found".
  deploy:
    name: 🚀 Deploy
    needs: build
    runs-on: ubuntu-latest

    # Grant GITHUB_TOKEN the permissions required to make a Pages deployment
    permissions:
      pages: write      # to deploy to Pages
      id-token: write   # to verify the deployment originates from an appropriate source

    # Deploy to the github-pages environment
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
    - name: 🚀 Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v5
